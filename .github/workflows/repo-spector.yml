name: Generate Repo Spector

on:
  schedule:
    - cron: '0 0 * * *' # 毎日自動更新
  workflow_dispatch: # 手動実行用

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run repo-spector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run github.com/4okimi7uki/repo-spector@latest

      - name: Commit and Push
        run: |
          git config local user.name "github-actions[bot]"
          git config local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update repo-spector stats" || exit 0
          git push
